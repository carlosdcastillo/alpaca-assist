exclude: ^(?:THIRD_PARTY_LICENSES/|web/js/lib/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, ts, tsx]
        additional_dependencies:
          - prettier@3.1.0
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -c "import os,subprocess,sys; c=os.path.join('.venv','Scripts','python.exe') if os.name=='nt' else os.path.join('.venv','bin','python'); sys.exit(subprocess.call([c if os.path.exists(c) else sys.executable,'-m','pytest','tests/','-q','--tb=short']))"
        language: system
        pass_filenames: false
        always_run: true
      - id: jest
        name: jest
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
